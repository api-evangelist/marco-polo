name: Marco Polo
description: >-
  MarcoPolo is an MCP-first enterprise AI data platform operated by Immersa -
  "Scale AI across the enterprise. Without the leaks." It exposes a hosted, remote
  Model Context Protocol (MCP) server that lets any AI assistant (Claude, ChatGPT,
  Cursor, Codex, or a custom agent) connect governed enterprise data sources -
  PostgreSQL, Snowflake, BigQuery, S3, OneDrive, Salesforce, Jira and local DuckDB
  - into a sandboxed workspace, run queries, and cache results, with centralized
  credential management, attribute-based access controls, token cost visibility,
  and SOC 2 Type II governance. Originally added to the API Evangelist network as a
  venture-portfolio lead and enriched from its public site, docs, and live MCP probes.
