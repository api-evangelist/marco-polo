name: MarcoPolo MCP Server
description: >-
  MarcoPolo is an MCP-first enterprise AI data platform. Its product surface IS a
  hosted, remote MCP server that lets any MCP client (Claude, ChatGPT, Cursor,
  Codex, or a custom agent) connect governed enterprise data sources into a
  sandboxed workspace, run queries, and cache results in DuckDB - "without the
  leaks." Operated by Immersa.
endpoint: https://mcp.marcopolo.dev
transport: streamable-http
hosting: hosted-remote
status: live
status_evidence: 'GET https://mcp.marcopolo.dev returns 401 (bearer token required)'
authentication:
  type: oauth2
  flow: authorization_code+pkce
  authorization_server: https://appealing-lion-77-staging.authkit.app
  metadata:
  - https://mcp.marcopolo.dev/.well-known/oauth-authorization-server
  - https://mcp.marcopolo.dev/.well-known/oauth-protected-resource
  identity_providers:
  - Google
  - Microsoft
  - GitHub
  - Email
  notes: >-
    Backed by WorkOS AuthKit. Protected-resource metadata (RFC 9728) points MCP
    clients at the AuthKit authorization server; bearer token passed in the
    Authorization header.
